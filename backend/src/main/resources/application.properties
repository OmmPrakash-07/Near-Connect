spring.application.name=near-connect
server.port=${PORT:8080}

# Zero-setup local database. Set DB_URL/DB_USERNAME/DB_PASSWORD to use MySQL.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/nearconnect;MODE=MySQL;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.demo.seed=${DEMO_SEED:true}
